name: Deploy NaviGuard Web App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd apps/naviguard
            # 1. Pull the latest code changes from origin
            git pull origin main
            
            # 2. Build and start the containers silently (Docker Compose automatically runs config-generator first and passes args)
            docker-compose up -d --build --remove-orphans
            
            # 3. Clean up unused builder layers to save disk space
            docker image prune -f

