name: Deploy NaviGuard Web App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/navguard
            # 1. Pull the latest code changes from origin
            git pull origin main
            
            # 2. Regenerate capacitor.config.json from .env (keeps server URL in sync)
            node scripts/generate-capacitor-config.js
            
            # 3. Build and start the containers silently (Docker Compose reads .env and passes args automatically)
            docker-compose up -d --build --remove-orphans
            
            # 4. Clean up unused builder layers to save disk space
            docker image prune -f
