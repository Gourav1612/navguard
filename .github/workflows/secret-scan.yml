name: Secret Scanner (TruffleHog)

on:
  # Scan every push to any branch
  push:
    branches:
      - '**'
  # Scan every pull request before merge
  pull_request:
    branches:
      - main
  # Allow manual trigger for one-off full-repo scans
  workflow_dispatch:

permissions:
  contents: read
  # Required to post PR review comments / annotations on findings
  pull-requests: write
  security-events: write

jobs:
  trufflehog-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout with full history for accurate diff scanning ──────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so TruffleHog can diff commits accurately
          fetch-depth: 0

      # ── 2. Run TruffleHog OSS against the entire repo ────────────────────────
      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          # Scan all commits on the current branch vs the base/main branch
          # On push to main, scans the latest commit diff
          # On PR, scans the entire PR diff against the base branch
          extra_args: >-
            --only-verified
            --fail
            --json

      # ── 3. Upload SARIF results to GitHub Security tab (if available) ─────────
      # Note: SARIF upload requires GitHub Advanced Security (paid) or public repos
      # This step is optional and will skip gracefully on private repos without GHAS
      - name: Upload TruffleHog SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trufflehog-results.sarif
          category: trufflehog

      # ── 4. Block the workflow if secrets were found ───────────────────────────
      # TruffleHog with --fail already exits non-zero on findings.
      # This step provides a human-readable summary in the Actions log.
      - name: Summary — No secrets detected
        if: success()
        run: |
          echo "✅ TruffleHog scan completed — no verified secrets detected in this push."
          echo ""
          echo "Scanned: ${{ github.repository }} @ ${{ github.sha }}"
