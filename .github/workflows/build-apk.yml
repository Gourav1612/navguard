name: Build NaviGuard APK

on:
  # Trigger build automatically on push to main branch
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
  # Allow manual trigger if custom version or custom notes are desired
  workflow_dispatch:
    inputs:
      version:
        description: 'New app version (e.g. 1.0.2). Leave empty to auto-increment.'
        required: false
      release_notes:
        description: 'What changed in this version? (Commit message is used if blank)'
        required: false

permissions:
  contents: write

env:
  VERSION: ''
  VERSION_CODE: ''
  RELEASE_NOTES: ''

jobs:
  build-apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # ── 3. Java (required by Gradle) ─────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── 4. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ── 5. Sync Capacitor native code ────────────────────────────────────────
      - name: Sync Capacitor (copy native plugins to android/)
        run: |
          rm -f public/NaviGuard.apk
          mkdir -p out
          mkdir -p android/app/src/main/assets
          npx cap sync android

      # ── 5.5 Determine version and release notes dynamically ──────────────────
      - name: Determine version and release notes
        id: determine_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            RELEASE_NOTES="${{ github.event.inputs.release_notes }}"
            if [ -z "$RELEASE_NOTES" ]; then
              RELEASE_NOTES="Manual build: v$VERSION"
            fi
            # Convert semver (1.2.3) to a simple integer for versionCode
            IFS='.' read -r MAJ MIN PAT <<< "$VERSION"
            VERSION_CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          else
            # Auto-increment logic
            CURRENT_VERSION=$(grep "versionName" android/app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
            CURRENT_CODE=$(grep "versionCode" android/app/build.gradle | sed 's/[^0-9]*//g')
            
            # Parse and increment patch version
            IFS='.' read -r MAJ MIN PAT <<< "$CURRENT_VERSION"
            NEW_PAT=$(( PAT + 1 ))
            VERSION="$MAJ.$MIN.$NEW_PAT"
            VERSION_CODE=$(( CURRENT_CODE + 1 ))
            
            # Get latest commit message for release notes
            RELEASE_NOTES="Auto-build: $(git log -1 --pretty=%s)"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "RELEASE_NOTES=$RELEASE_NOTES" >> $GITHUB_ENV
          echo "Determined Version: $VERSION"
          echo "Determined Version Code: $VERSION_CODE"
          echo "Determined Release Notes: $RELEASE_NOTES"

      # ── 6. Bump version in version.json ──────────────────────────────────────
      - name: Update version.json
        run: |
          echo '{
            "version": "${{ env.VERSION }}",
            "apkUrl": "/NaviGuard.apk",
            "releaseNotes": "${{ env.RELEASE_NOTES }}"
          }' > public/version.json
          cat public/version.json

      # ── 7. Update Android versionCode & versionName ──────────────────────────
      - name: Bump Android versionCode and versionName in build.gradle
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ env.VERSION_CODE }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ env.VERSION }}\"/" android/app/build.gradle
          echo "Android versionCode=${{ env.VERSION_CODE }} versionName=${{ env.VERSION }}"

      # ── 7.5 Generate consistent debug.keystore if not exists ────────────────
      - name: Generate debug.keystore if missing
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "Generating new shared debug.keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          else
            echo "Using existing debug.keystore."
          fi

      # ── 8. Build debug APK ───────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      # ── 9. Copy APK → public/ so Vercel can serve it for in-app updates ──────
      - name: Copy APK to public folder
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk public/NaviGuard.apk
          echo "APK size: $(du -sh public/NaviGuard.apk | cut -f1)"

      # ── 10. Commit updated files back to repo (Vercel auto-deploys) ──────────
      - name: Commit APK and version.json
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions Bot"
          git add public/NaviGuard.apk public/version.json android/app/build.gradle android/app/debug.keystore
          git commit -m "release: NaviGuard v${{ env.VERSION }} APK [skip ci]"
          git push

      # ── 11. Create GitHub Release with the APK attached ──────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: NaviGuard v${{ env.VERSION }}
          body: |
            ## 📱 NaviGuard v${{ env.VERSION }}

            ${{ env.RELEASE_NOTES }}

            ### Installation
            Download the APK below and install it on the driver's Android device.

            > ⚠️ Make sure to allow installation from unknown sources in your phone settings.
          files: public/NaviGuard.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 12. Upload APK as workflow artifact too (backup) ─────────────────────
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaviGuard-v${{ env.VERSION }}.apk
          path: public/NaviGuard.apk
          retention-days: 30
